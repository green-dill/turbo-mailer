helmDefaults:
  createNamespace: true
  atomic: true
  timeout: 300

environments:
  dev:
    values:
      - deploy/env-dev.yaml
  test:
    values:
      - deploy/env-test.yaml
  prod:
    values:
      - deploy/env-prod.yaml

---

releases:
  - name: turbo-mailer
    namespace: turbo-mailer-{{ .Environment.Name }}
    chart: ./charts/turbo-mailer
    values:
      - deploy/values-{{ .Environment.Name }}.yaml
      - worker:
          domains:
            {{- range .Values.emailDomains }}
            - {{ .domain }}
            {{- end }}

  {{- range .Values.emailDomains }}
  - name: postfix-{{ .domain | sha1sum | trunc 8 }}
    namespace: turbo-mailer-{{ $.Environment.Name }}
    chart: ./charts/postfix
    values:
      - checkDNS:
          enabled: true
      - replicaCount: {{ len .serverLabels }}
      - domain: {{ .domain }}
      {{- if .serverLabels }}
      - affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    {{- range .serverLabels }}
                    - {key: {{ . }}, operator: Exists}
                    {{- end }}
      {{- end }}
  {{- end }}

