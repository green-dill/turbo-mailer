ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: uptime.report.write360.cn
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
   - secretName: uptime-tls
     hosts:
       - uptime.report.write360.cn
