auth:
  ZO_ROOT_USER_EMAIL: "admin@write360.cn"
  ZO_ROOT_USER_PASSWORD: "pPX6PmA2ZRECjVEu3SGe"

config:
  ZO_COMPACT_DATA_RETENTION_DAYS: "30"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/issuer:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/client-body-buffer-size: 20m
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-max-temp-file-size: "0"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/server-snippet: |
      chunked_transfer_encoding on;
      proxy_ignore_headers 'X-Accel-Buffering';
  hosts:
    - host: openobserve.report.write360.cn
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: openobserve-tls
      hosts:
        - openobserve.report.write360.cn
