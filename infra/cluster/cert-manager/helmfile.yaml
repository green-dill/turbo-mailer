helmfiles:
  - path: ../common/helmfile.yaml

repositories:
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    installed: true
    values:
      - values.yaml
    hooks:
      - events:
          - postsync
        showlogs: true
        command: /bin/bash
        args:
          - -c
          - |
            echo "Applying ClusterIssuer"
            kubectl apply -f - <<'EOF'
            apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata:
              name: letsencrypt
              namespace: cert-manager
            spec:
              acme:
                server: https://acme-v02.api.letsencrypt.org/directory
                email: yinheli+turbo-mailer@gmail.com
                privateKeySecretRef:
                  name: letsencrypt
                solvers:
                - http01:
                    ingress:
                      class: nginx
            EOF
