controller:
  allowSnippetAnnotations: true

  extraEnvs:
    - name: TZ
      value: Asia/Shanghai

  replicaCount: 2

  ingressClassResource:
    name: nginx
    default: true

  resources:
    requests:
      cpu: 10m
      memory: 16Mi

  config:
    use-proxy-protocol: "true"
    allow-backend-server-header: "true"
    allow-snippet-annotations: "true"
    compute-full-forwarded-for: "true"
    enable-real-ip: "true"
    proxy-real-ip-cidr: "0.0.0.0/0"
    enable-underscores-in-headers: "true"
    generate-request-id: "true"
    gzip-level: "6"
    gzip-types: |-
      application/atom+xml
      application/font-woff
      application/javascript
      application/json
      application/rss+xml
      application/ttf
      application/vnd.ms-fontobject
      application/wasm
      application/x-font-ttf
      application/x-javascript
      application/x-ttf
      application/x-web-app-manifest+json
      application/xhtml+xml
      application/xml
      font/opentype
      font/opentype
      font/ttf
      image/svg+xml
      image/x-icon
      text/css
      text/plain
      text/x-component
      text/html
    ignore-invalid-headers: "true"
    log-format-upstream: '{"time": "$time_iso8601", "remote_addr": "$remote_addr",
      "x_forward_for": "$proxy_add_x_forwarded_for", "request_id": "$req_id", "remote_user":
      "$remote_user", "bytes_sent": $bytes_sent, "request_time": $request_time, "status":
      $status, "vhost": "$host", "request_proto": "$server_protocol", "path": "$uri",
      "request_query": "$args", "request_length": $request_length, "duration": $request_time,"method":
      "$request_method", "http_referrer": "$http_referer", "http_user_agent": "$http_user_agent",
      "global_rate_limit_exceeding": "$global_rate_limit_exceeding"
      }'
    max-worker-connections: "65536"
    proxy-add-original-uri-header: "true"
    proxy-body-size: 5000m
    proxy-connect-timeout: "60"
    reuse-port: "true"
    server-tokens: "false"
    ssl-redirect: "false"
    upstream-keepalive-timeout: "120"
    use-forwarded-headers: "true"
    use-gzip: "true"
    worker-cpu-affinity: auto
    worker-processes: "4"

  service:
    type: ClusterIP

admissionWebhooks:
  extraEnvs:
    - name: TZ
      value: Asia/Shanghai
