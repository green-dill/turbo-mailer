domains:
  - domain: mail.degb.cc
    server_labels:
      - postfix/mail-degb-cc

config: |
  server:
    address: :5000

  database:
    turbo-mailer:
      uri: "postgres://turbomailer:password@turbo-mailer-postgresql:5432/turbo-mailer?sslmode=disable"

  redis:
    turbo-mailer:
      name: "turbo-mailer"
      addr: "turbo-mailer-redis-master:6379"
      password: "password"
      db: 0
      poolSize: 10
      maxRetries: 3
      prefix: "dev"

  rabbitmq:
    url: "amqp://user:password@turbo-mailer-rabbitmq:5672"

  log:
    level: debug
