frontend:
  replicaCount: 1

  image:
    repository: yinheli/turbo-mailer-frontend
    pullPolicy: Always
    tag: "master"

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
    - host: dashboard.degb.cc
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - secretName: turbo-mailer-tls
      hosts:
      - dashboard.degb.cc

api:
  replicaCount: 2

  image:
    repository: yinheli/turbo-mailer-server
    pullPolicy: Always
    tag: "master"

worker:
  replicaCount: 4

  image:
    repository: yinheli/turbo-mailer-server
    pullPolicy: Always
    tag: "master"


dispatcher:
  replicaCount: 1

  image:
    repository: yinheli/turbo-mailer-server
    pullPolicy: Always
    tag: "master"
