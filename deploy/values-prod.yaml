frontend:
  replicaCount: 2

  image:
    repository: turbo-mailer-frontend
    pullPolicy: Always
    tag: ""

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: turbo-mailer.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: turbo-mailer-tls
        hosts:
          - turbo-mailer.local

api:
  replicaCount: 2

  image:
    repository: turbo-mailer-server
    pullPolicy: Always
    tag: ""

worker:
  replicaCount: 4

  image:
    repository: turbo-mailer-server
    pullPolicy: Always
    tag: ""

