apiVersion: v1
kind: Service
metadata:
  name: {{ include "turbo-mailer.fullname" . }}-api
  labels:
    {{- include "turbo-mailer.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    helm.sh/resource-policy: keep
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "turbo-mailer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
