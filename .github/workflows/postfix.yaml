name: Build Postfix

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'
    paths:
      - 'charts/postfix/**'
      - '.github/workflows/postfix.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0

      - name: Helm lint
        run: |
          helm lint ./charts/postfix

      - name: Helm template
        run: |
          helm template ./charts/postfix > /dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./charts/postfix/container
          file: ./charts/postfix/container/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/turbo-mailer-postfix:latest
            ${{ secrets.DOCKER_USERNAME }}/turbo-mailer-postfix:${{ github.ref_name }}
